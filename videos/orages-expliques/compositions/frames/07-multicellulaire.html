    (function () {
      var ID = "07-multicellulaire";
      var root = document.querySelector('[data-composition-id="07-multicellulaire"]') || document;
      function all(name) {
        return Array.prototype.slice.call(root.getElementsByClassName(ID + "-" + name));
      }
      function one(name) {
        return all(name)[0];
      }

      var dotFill = one("dot-fill");
      var chunks = all("chunk");
      var stage = one("stage");
      var cells = all("cell");
      var hail = all("hail");
      var rain = all("rain");
      var trackLine = one("track-line");
      var ticks = all("tick");
      var fill = one("track-fill");
      var head = one("track-head");
      var hours = one("hours");
      var labelGrele = one("label-grele");
      var labelAverses = one("label-averses");

      gsap.set(cells, { transformOrigin: "50% 100%" });
      gsap.set([trackLine, fill], { transformOrigin: "0% 50%" });
      gsap.set(ticks, { transformOrigin: "50% 50%" });
      gsap.set(stage, { transformOrigin: "540px 1480px" });
      gsap.set(rain, { rotation: 12, transformOrigin: "50% 0%" });

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–1.6s) — same stage as Frame 6: chrome + ground present from the cut.
      // Dot 2 fills, then h1 per-chunk: "multi" (0.38s) + "cellulaire" (0.58s).

      tl.fromTo(chunks[0], { yPercent: 112 }, { yPercent: 0, duration: 0.75, ease: "power3.out" }, 0.38);
      tl.fromTo(chunks[1], { yPercent: 112 }, { yPercent: 0, duration: 0.75, ease: "power3.out" }, 0.58);
      // Time-track hairline draws in under the ground, anticipating the relay.
      tl.fromTo(trackLine, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 1.1);

      // Scene 2 (1.6–3.6s) — "plusieurs cellules": three cells rise in relay, left → right.
      // Each new cell rises as the previous one collapses to half (and dims).
      tl.fromTo(cells[0], { scaleX: 0.6, scaleY: 0.04, opacity: 0 }, { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 1.6);
      tl.fromTo(cells[1], { scaleX: 0.6, scaleY: 0.04, opacity: 0 }, { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 2.2);
      tl.fromTo(cells[0], { scaleX: 1, scaleY: 1, opacity: 1 }, { scaleX: 0.78, scaleY: 0.5, opacity: 0.55, duration: 0.55, ease: "power3.inOut", immediateRender: false }, 2.2);
      tl.fromTo(cells[2], { scaleX: 0.6, scaleY: 0.04, opacity: 0 }, { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 2.8);
      tl.fromTo(cells[1], { scaleX: 1, scaleY: 1, opacity: 1 }, { scaleX: 0.78, scaleY: 0.5, opacity: 0.55, duration: 0.55, ease: "power3.inOut", immediateRender: false }, 2.8);
      tl.fromTo(cells[0], { scaleX: 0.78, scaleY: 0.5, opacity: 0.55 }, { scaleX: 0.62, scaleY: 0.3, opacity: 0.35, duration: 0.55, ease: "power3.inOut", immediateRender: false }, 2.8);

      // Slow push on the storm row from the ground line (macro move under the relay + hold).
      tl.fromTo(stage, { scale: 1 }, { scale: 1.03, duration: 3.55, ease: "none" }, 1.6);

      // Time track fills orange left → right; hour ticks land as the playhead passes them.
      var TRACK_START = 1.6;
      var TRACK_DUR = 1.9;
      tl.fromTo(head, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 1.45);
      tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: TRACK_DUR, ease: "none" }, TRACK_START);
      tl.fromTo(head, { x: 0 }, { x: 952, duration: TRACK_DUR, ease: "none" }, TRACK_START);
      ticks.forEach(function (tick, i) {
        tl.fromTo(tick, { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power3.out" }, TRACK_START + i * (TRACK_DUR / (ticks.length - 1)));
      });
      // "PLUSIEURS HEURES" lands on "heures".
      tl.fromTo(hours, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 3.2);

      // Scene 3 (3.7–5.17s) — "grêle": hail drops from the mature cell, staggered per index (finite).

        var d = parseFloat(stone.getAttribute("data-d")) || 0;

      });

      // "averses" (4.4s): dense rain streaks draw down from the relaying cells, staggered per index.
