      var plus = byCls("plus");
      var minus = byCls("minus");
      var fill = byId("fill");
      var flash = byId("flash");
      var boltG = byId("bolt-g");
      var boltMain = byId("bolt-main");
      var boltB1 = byId("bolt-b1");
      var boltB2 = byId("bolt-b2");

      var tl = gsap.timeline({ paused: true });

      // ── Macro camera: slow push into the top of the cloud, settles before the strike
      tl.fromTo(
        cam,
        { scale: 1, transformOrigin: "540px 1000px" },
        { scale: 1.04, transformOrigin: "540px 1000px", duration: 4.6, ease: "sine.inOut" },
        0,
      );

      // ── Scene 1 (0.0–2.9s): cloud interior, kicker, hailstones, crystals, collisions
      tl.fromTo(
        byId("rule"),
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, transformOrigin: "left center", duration: 0.5, ease: "power3.out" },
        0.1,
      );
      tl.fromTo(
        byId("kicker"),
        { opacity: 0, x: -24 },
        { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
        0.15,
      );
      tl.fromTo(
        byId("ground"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.9, ease: "power3.out" },
        0.25,
      );
      // "grêlons" (0.64s)
      tl.fromTo(
        hails,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.045 },
        0.6,
      );
      // "cristaux" (1.11s)
      tl.fromTo(
        crys,
        { scale: 0, opacity: 0, rotation: -60 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "power3.out", stagger: 0.045 },
        1.1,
      );
      // "s'entrechoquent" (1.94s): each hail/crystal pair knocks together, then rebounds apart
      DATA.forEach(function (d, i) {
        var t = 1.94 + i * 0.055;
        tl.fromTo(
          hails[i],
          { x: 0, y: 0 },
          { x: d.ha[0], y: d.ha[1], duration: 0.14, ease: "power2.in" },
          t,
        );
        tl.fromTo(
          crys[i],
          { x: 0, y: 0 },
          { x: -d.ha[0], y: -d.ha[1], duration: 0.14, ease: "power2.in" },
          t,
        );
        tl.to(hails[i], { x: d.hb[0], y: d.hb[1], duration: 0.5, ease: "power3.out" }, t + 0.14);
        tl.to(
          crys[i],
          { x: -d.hb[0], y: -d.hb[1], rotation: d.rot, duration: 0.5, ease: "power3.out" },
          t + 0.14,
        );
      });

      // ── Scene 2 (2.9–4.5s): "sépare les charges" — particles fall back, + rise, – sink
      tl.to(
        hails.concat(crys),
        { opacity: 0.2, duration: 0.5, ease: "power2.out", stagger: 0.015 },
        2.92,
      );
      tl.fromTo(
        byId("tension"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        2.92,
      );
      // tension fill builds left→right as the VO climbs to "électriques…"
      tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: 1.56, ease: "power1.in" }, 2.98);
      plus.forEach(function (el, i) {
        var d = DATA[i];
        tl.fromTo(
          el,
          { x: d.ps[0], y: d.ps[1], opacity: 0, scale: 0.4 },
          { x: 0, y: 0, opacity: 1, scale: 1, duration: 0.95, ease: "power3.out" },
          3.0 + i * 0.065,
        );
      });
      minus.forEach(function (el, i) {
        var d = DATA[i];
        tl.fromTo(
          el,
          { x: d.ms[0], y: d.ms[1], opacity: 0, scale: 0.4 },
          { x: 0, y: 0, opacity: 1, scale: 1, duration: 0.95, ease: "power3.out" },
          3.04 + i * 0.065,
        );
      });
      // charges tremble as tension peaks — finite, index-based, returns to rest
      var JX = [3, -3, 2, -2, 0];
      var JY = [-2, 2, -1, 1, 0];
      plus.concat(minus).forEach(function (el, i) {
        var j = el.firstElementChild;
        var s = i % 2 === 0 ? 1 : -1;
        for (var k = 0; k < JX.length; k++) {
          tl.to(j, { x: JX[k] * s, y: JY[k] * s, duration: 0.07, ease: "none" }, 4.2 + k * 0.07);
        }
      });

      // ── Scene 3 (4.5–5.0s): "boum" — bolt strikes from the – band to the ground
      var lm = prepDash(boltMain, polyLen(BOLT));
      var l1 = prepDash(boltB1, polyLen(B1));
      var l2 = prepDash(boltB2, polyLen(B2));
      var T_BOLT = 4.6;
      var D_BOLT = 0.12;
      var total = polyLen(BOLT);
      var tFork1 = T_BOLT + D_BOLT * (polyLen(BOLT.slice(0, 3)) / total);
      var tFork2 = T_BOLT + D_BOLT * (polyLen(BOLT.slice(0, 5)) / total);
      tl.fromTo(
        boltMain,
        { strokeDashoffset: lm },
        { strokeDashoffset: 0, duration: D_BOLT, ease: "none" },
        T_BOLT,
      );
      tl.fromTo(
        boltB1,
        { strokeDashoffset: l1 },
        { strokeDashoffset: 0, duration: 0.09, ease: "none" },
        tFork1,
      );
      tl.fromTo(
        boltB2,
        { strokeDashoffset: l2 },
        { strokeDashoffset: 0, duration: 0.07, ease: "none" },
        tFork2,
      );
      // contact with the ground → one-shot flash (with a single flicker) that decays
      var T_HIT = T_BOLT + D_BOLT;
      tl.fromTo(flash, { opacity: 0 }, { opacity: 0.92, duration: 0.03, ease: "none" }, T_HIT - 0.02);
      tl.to(flash, { opacity: 0.2, duration: 0.06, ease: "power1.out" }, T_HIT + 0.01);
      tl.to(flash, { opacity: 0.6, duration: 0.04, ease: "none" }, T_HIT + 0.07);
      tl.to(flash, { opacity: 0, duration: 0.55, ease: "power2.out" }, T_HIT + 0.11);
      tl.fromTo(
        boltG,
        { opacity: 1 },
        { opacity: 0.4, duration: 0.04, ease: "none" },
        T_HIT + 0.06,
      );
      tl.to(boltG, { opacity: 1, duration: 0.08, ease: "power1.out" }, T_HIT + 0.1);
      tl.fromTo(
        byId("impact"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, ease: "expo.out" },
        T_HIT,
      );
      // one decaying shake of the whole frame
      var SH = [
        [-16, 9],
        [13, -7],
        [-9, 5],
        [6, -3],
        [-3, 2],
        [0, 0],
      ];
      SH.forEach(function (p, k) {
        tl.to(
          shake,
          { x: p[0], y: p[1], duration: 0.05, ease: k === SH.length - 1 ? "power2.out" : "none" },
          T_HIT + k * 0.05,
        );
      });
      // discharge: tension drains, charges and particles step back so the strike owns the frame
      tl.to(fill, { scaleX: 0, duration: 0.7, ease: "expo.out" }, T_HIT);
      tl.to(byId("charges"), { opacity: 0.4, duration: 0.5, ease: "power2.out" }, T_HIT + 0.1);
      tl.to(byId("particles"), { opacity: 0.5, duration: 0.5, ease: "power2.out" }, T_HIT + 0.1);

      // ── Scene 4 (5.0–6.77s): "L'éclair" → h1; "tonnerre" → sound arcs + label, hold
      tl.fromTo(
        byId("h1"),
        { yPercent: 115 },
        { yPercent: 0, duration: 0.75, ease: "expo.out" },
        5.04,
      );
      byCls("arc").forEach(function (g, k) {
        var t = 5.96 + k * 0.1;
        var op = parseFloat(g.getAttribute("data-op"));
        tl.fromTo(
          g,
          { scale: 0.55, opacity: 0, svgOrigin: GX + " " + GY },
          {
            scale: 1,
            opacity: op,
            svgOrigin: GX + " " + GY,
            duration: 0.55,
            ease: "power3.out",
          },
          t,
        );
        Array.prototype.forEach.call(g.querySelectorAll("path"), function (p) {
          var r = parseFloat(p.getAttribute("data-r"));
          var L = prepDash(p, (Math.PI * r) / 2);
          tl.fromTo(
            p,
            { strokeDashoffset: L },
            { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
            t,
          );
        });
      });
      tl.fromTo(
        byId("thunder-label"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        6.04,
      );

      window.__timelines["05-eclair"] = tl;
    })();
  </script>
</template>
