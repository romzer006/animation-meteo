  <script>
    (function () {
      var FID = "06-monocellulaire";
      var DUR = 6.152;
      function el(name) {
        return document.getElementById(FID + "-" + name);
      }

      /* ── rain sheet: deterministic streak field (seeded PRNG) ──
         The sheet falls linearly from the cloud base; streak density tapers toward
         its tail so the shower thins out as the cell dies. */
      var RAIN_W = 220;
      var RAIN_H = 352;
      var RAIN_T0 = 3.2;
      var RAIN_TRAVEL = 2240;
      var RAIN_L = RAIN_TRAVEL + RAIN_H;
      var rainLayer = el("rain-layer");
      var rainSvg = el("rain-svg");
      rainLayer.style.top = -RAIN_L + "px";
      rainLayer.style.height = RAIN_L + "px";
      rainSvg.setAttribute("viewBox", "0 0 " + RAIN_W + " " + RAIN_L);
      rainSvg.setAttribute("width", String(RAIN_W));
      rainSvg.setAttribute("height", String(RAIN_L));

      var seed = 20260705;
      function rnd() {
        seed = (seed * 16807) % 2147483647;
        return seed / 2147483647;
      }
      function density(u) {
        var front = Math.min(1, 0.45 + (0.55 * (RAIN_L - u)) / 160);
        var tail = u >= 1350 ? 1 : Math.max(0.28, 0.28 + (0.72 * (u - 350)) / 1000);
        return Math.min(front, tail);
      }
      var SVG_NS = "http://www.w3.org/2000/svg";
      var SLOTS = 4;
      var ROW = 28;
      var slotW = RAIN_W / SLOTS;
      for (var u = RAIN_L - 8; u > 0; u -= ROW) {
        var d = density(u);
        for (var k = 0; k < SLOTS; k++) {
          var pick = rnd();
          var jx = rnd();
          var jy = rnd();
          var jl = rnd();
          if (pick > d) continue;
          var x = Math.round((k + 0.12 + jx * 0.76) * slotW);
          var y2 = u - Math.round(jy * 12);
          var y1 = y2 - (24 + Math.round(jl * 18));
          var ln = document.createElementNS(SVG_NS, "line");
          ln.setAttribute("x1", String(x));
          ln.setAttribute("y1", String(y1));
          ln.setAttribute("x2", String(x));
          ln.setAttribute("y2", String(y2));
          rainSvg.appendChild(ln);
        }
      }

      /* ── stopwatch arc: measured length for the self-draw ── */
      var arc = el("clock-arc");
      var arcLen = 0;
      try {
        arcLen = arc.getTotalLength();
      } catch (e) {
        arcLen = 0;
      }
      if (!arcLen || !isFinite(arcLen)) arcLen = 86 * ((300 * Math.PI) / 180);
      arcLen = arcLen + 1;
      arc.style.strokeDasharray = String(arcLen);
      arc.style.strokeDashoffset = String(arcLen);

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (0.0–2.2s) — stage floor draws, h1 reveals by chunks */
      tl.fromTo(el("ground"), { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.out" }, 0.05);

      /* dynamic-content-sequencing: pre-computed flat TIMELINE from content length */
      var SEQ_START = 0.45;
      var BASE_DURATION = 0.34;
      var SEC_PER_CHAR = 0.02;
      var ENTER = 0.7;
      var H1_CONTENT = [
        { key: "mono", node: el("h1-mono"), hold: 0 },
        { key: "cellulaire", node: el("h1-cell"), hold: 0 },
      ];
      var cumulative = SEQ_START;
      var H1_TIMELINE = H1_CONTENT.map(function (entry) {
        var dur = BASE_DURATION + entry.key.length * SEC_PER_CHAR + entry.hold;
        var start = cumulative;
        cumulative += dur;
        return { key: entry.key, node: entry.node, start: start, end: cumulative };
      });
      H1_TIMELINE.forEach(function (entry) {
        tl.fromTo(
          entry.node,
          { yPercent: 108 },
          { yPercent: 0, duration: ENTER, ease: "expo.out" },
          entry.start
        );
      });

      /* slow macro push under the illustration, anchored on the ground line */
      tl.fromTo(el("scene"), { scale: 1 }, { scale: 1.03, duration: DUR, ease: "none" }, 0);

      /* Scene 2 (2.2–3.0s) — "une seule cellule": the cell grows from its base */
      tl.fromTo(
        el("cloud"),
        { scaleY: 0, scaleX: 0.7 },
        { scaleY: 1, scaleX: 1, duration: 0.85, ease: "power3.out" },
        2.2
      );
      tl.fromTo(
        el("cloud-anvil"),
        { scaleX: 0.25, svgOrigin: "250 66" },
        { scaleX: 1, svgOrigin: "250 66", duration: 0.65, ease: "power3.out" },
        2.48
      );
      tl.fromTo(el("dim"), { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 2.5);
      tl.fromTo(
        el("dim-label"),
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.62
      );

      /* Scene 3 (3.0–4.2s) — "moins d'une heure": stopwatch ring self-draws, rain falls */
      tl.fromTo(
        el("clock"),
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        2.98
      );
      tl.fromTo(
        arc,
        { strokeDashoffset: arcLen },
        { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" },
        3.05
      );
      tl.fromTo(
        el("clock-hand"),
        { rotation: 0, svgOrigin: "100 120" },
        { rotation: 300, svgOrigin: "100 120", duration: 0.75, ease: "power2.out" },
        3.05
      );
      tl.fromTo(
        el("rain-layer"),
        { y: 0 },
        { y: RAIN_TRAVEL, duration: DUR - RAIN_T0, ease: "none" },
        RAIN_T0
      );
      tl.fromTo(
        el("stat-inner"),
        { yPercent: 108 },
        { yPercent: 0, duration: 0.65, ease: "expo.out" },
        3.38
      );

      /* Scene 4 (4.2–6.15s) — "orage de chaleur": sun + tag slide in; "soirs d'été": the cell deflates */
      tl.fromTo(
        el("sun"),
        { x: 70, opacity: 0, rotation: -90 },
        { x: 0, opacity: 1, rotation: 0, duration: 0.7, ease: "power3.out" },
        4.25
      );
      tl.fromTo(
        el("tag"),
        { x: 70, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
        4.6
      );
      tl.fromTo(
        el("cloud-anvil"),
        { scaleX: 1, scaleY: 1, y: 0, svgOrigin: "250 66" },
        {
          scaleX: 1.12,
          scaleY: 0.62,
          y: 42,
          svgOrigin: "250 66",
          duration: 0.9,
          ease: "power3.out",
          immediateRender: false,
        },
        5.2
      );
      tl.fromTo(
        el("cloud-upper"),
        { scale: 1, svgOrigin: "240 250" },
        { scale: 0.86, svgOrigin: "240 250", duration: 0.9, ease: "power3.out", immediateRender: false },
        5.2
      );
      tl.fromTo(
        el("cloud"),
        { opacity: 1 },
        { opacity: 0.8, duration: 0.9, ease: "power1.out", immediateRender: false },
        5.2
      );

      window.__timelines["06-monocellulaire"] = tl;
    })();
  </script>
