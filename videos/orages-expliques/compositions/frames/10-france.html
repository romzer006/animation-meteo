  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "10-france";
      var el = function (name) { return document.getElementById(ID + "-" + name); };
      var stage = el("stage");
      var byClass = function (name) {
        return Array.prototype.slice.call(stage.getElementsByClassName(ID + "-" + name));
      };

      // ---- geometry (fixed by the map asset) ----
      var MAP_LEFT = 60, MAP_TOP = 558, K = 0.96;  // px per viewBox unit
      var STAGE_CX = 540, STAGE_CY = 960;          // zoom-outer centre (transform-origin 50% 50%)

      var outer = el("zoom-outer");
      var inner = el("zoom-inner");
      var mainland = el("mainland");
      var corse = el("corse");

      // svg-path-draw: measured lengths (slight overestimate for multi-subpath outlines)
      function measure(p, fallback) {
        var len = 0;
        try { len = p.getTotalLength(); } catch (e) { len = 0; }
        if (!len || !isFinite(len)) len = fallback;
        return Math.ceil(len * 1.02);
      }
      var LEN_MAIN = measure(mainland, 5300);
      var LEN_CORSE = measure(corse, 507);
      mainland.style.strokeDasharray = LEN_MAIN + " " + LEN_MAIN;
      corse.style.strokeDasharray = LEN_CORSE + " " + LEN_CORSE;

      // coordinate-target-zoom: Corsica's real centre, from its own geometry (viewBox units, transform-free)
      var bb = null;
      try { bb = corse.getBBox(); } catch (e) { bb = null; }
      var cxU = bb && bb.width > 0 ? bb.x + bb.width / 2 : 965.65;
      var cyU = bb && bb.height > 0 ? bb.y + bb.height / 2 : 881.9;
      var TARGET_OFFSET_X = MAP_LEFT + cxU * K - STAGE_CX; // ≈ +447
      var TARGET_OFFSET_Y = MAP_TOP + cyU * K - STAGE_CY;  // ≈ +445
      var ZOOM_AT = 7.7, ZOOM_DUR = 1.6, ZOOM_SCALE = 2.2, DRIFT_SCALE = 1.035;

      var tl = gsap.timeline({ paused: true });

      // ===== Scene 1 (0.0–0.8s): kicker + France outline self-draws =====
      tl.fromTo(mainland, { strokeDashoffset: LEN_MAIN }, { strokeDashoffset: 0, duration: 1.3, ease: "power2.out" }, 0.05);
      tl.fromTo(corse, { strokeDashoffset: LEN_CORSE }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 0.5);
      tl.fromTo(el("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo(el("kicker-text"), { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, 0.18);
      // macro camera drift underneath scenes 1–3 (settles before the zoom commits)
      tl.fromTo(outer, { scale: 1 }, { scale: DRIFT_SCALE, duration: 7.6, ease: "sine.inOut" }, 0);

      // ===== Scene 2 (0.8–3.6s): summer storm dots burst out from the centre of the map =====
      var START_P = 0.3; // partially-spread start (12 items)
      byClass("dot").forEach(function (dot, i) {
        var tx = Number(dot.dataset.targetX);
        var ty = Number(dot.dataset.targetY);
        tl.fromTo(
          dot,
          { xPercent: -50, yPercent: -50, x: tx * START_P, y: ty * START_P, scale: 0.6, opacity: 0 },
          { x: tx, y: ty, scale: 1, opacity: 1, duration: 1.1, ease: "power3.out" },
          1.4 + i * 0.07 // "orages mono et multicellulaires"
        );
      });
      // legend line 1 on "l'été" (3.16s)
      tl.fromTo(el("legend-1"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 3.16);
      tl.fromTo(el("swatch-dot"), { scale: 0 }, { scale: 1, duration: 0.45, ease: "power3.out" }, 3.2);

      // ===== Scene 3 (4.0–7.4s): supercells — dots dim, orange spirals SW then East =====
      tl.fromTo(el("burst"), { opacity: 1 }, { opacity: 0.4, duration: 0.6, ease: "power2.out", immediateRender: false }, 4.32);

      tl.fromTo([mainland, corse], { strokeWidth: 3.125 }, { strokeWidth: 3 / (K * ZOOM_SCALE), duration: ZOOM_DUR, ease: "power3.inOut", immediateRender: false }, ZOOM_AT);

      tl.fromTo(mainland, { opacity: 1 }, { opacity: 0.25, duration: 1.0, ease: "power2.out", immediateRender: false }, ZOOM_AT);

      // "août 2022" (7.7s)
      tl.fromTo(el("date-text"), { yPercent: 110 }, { yPercent: 0, duration: 0.65, ease: "expo.out" }, 7.72);
      // "derecho" (9.01s)
      tl.fromTo(byClass("letter"), { yPercent: 110 }, { yPercent: 0, duration: 0.75, ease: "expo.out", stagger: 0.035 }, 9.0);

      tl.fromTo(corse, { fillOpacity: 0, stroke: "#F0ECE5" }, { fillOpacity: 1, stroke: "#E85D26", duration: 0.45, ease: "power2.out" }, 10.0);
      tl.fromTo(el("corse-label-text"), { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, 10.05);
      byClass("gust").forEach(function (g, i) {
        tl.fromTo(g, { x: -620, opacity: 0 }, { x: 0, opacity: 1, duration: 1.1, ease: "power3.out" }, 10.08 + i * 0.08);
      });
      // "deux cents" (10.87s): value-scaled counter
      var num = el("num");
      var count = { value: 0 };
      var COUNT_AT = 10.8, COUNT_DUR = 0.9, START_SCALE = 0.5;
      tl.fromTo(
        count,
        { value: 0 },
        {
          value: 200,
          duration: COUNT_DUR,
          ease: "power3.out",
          onUpdate: function () { num.textContent = String(Math.round(count.value)); }

        COUNT_AT

      tl.fromTo(num, { scale: START_SCALE, opacity: 0 }, { scale: 1, opacity: 1, duration: COUNT_DUR, ease: "power3.out" }, COUNT_AT);
      tl.fromTo(el("unit"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 10.95);
      tl.fromTo(el("plus"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 11.6);
      // hold (breather) to 12.317s

      window.__timelines["10-france"] = tl;
    })();
