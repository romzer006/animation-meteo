      // binary opacity, whip up from below on power4.out; heavy words travel further.
      var words = [
        { id: "w0", at: 0.46, y: 80, d: 0.2 },
        { id: "w1", at: 0.84, y: 44, d: 0.13 },
        { id: "w2", at: 0.95, y: 84, d: 0.22 },
      ];
      words.forEach(function (w) {
        var e = el(w.id);
        tl.fromTo(e, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, w.at);
        tl.fromTo(e, { y: w.y }, { y: 0, duration: w.d, ease: "power4.out" }, w.at);
      });

      // ── Scene 2 (1.5–4.0s): "orages alignés" — waterfall-entry of 14 cells, top → bottom. ──
      // Gaps SHRINK across the cascade (accelerating wave); bigger cells travel further / settle longer.
      var SIZES = [70, 89, 92, 115, 114, 127, 129, 123, 128, 111, 111, 94, 88, 70];
      var at = 1.52;
      var gap = 0.085;
      for (var i = 0; i < SIZES.length; i++) {
        var cell = [el("disc-" + i), el("core-" + i)];
        var yOff = Math.round(30 + 0.4 * SIZES[i]);
        var dur = 0.12 + 0.0008 * SIZES[i];
        tl.fromTo(cell, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, at);
        tl.fromTo(cell, { y: yOff, scale: 0.6 }, { y: 0, scale: 1, duration: dur, ease: "power4.out" }, at);
        at += gap;
        gap -= 0.0035;
      }

      // The whole line advances right ~120px — one smooth move.
      tl.fromTo(el("line"), { x: 0 }, { x: 120, duration: 1.2, ease: "power2.inOut" }, 2.4);

      // "centaines de kilomètres" (2.72s): ruler hairline spans the line, end ticks, mono label.
      tl.fromTo(el("ruler"), { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 2.7);
      tl.fromTo([el("tick-a"), el("tick-b")], { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, 3.0);
      tl.fromTo(el("km"), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 2.82);
      tl.fromTo(el("km-0"), { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "power3.out" }, 2.84);
      tl.fromTo(el("km-1"), { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "power3.out" }, 2.92);

      // ── Scene 3 (4.0–5.94s): "rafales" — five chevrons streak out ahead of the line. ──
      // motion-blur-streak, path A: directional feGaussianBlur ("X 0") tweened via a proxy on the
      // SAME window + ease as the position, so peak blur = peak speed and each lands razor-sharp.
      var PEAK_BLUR = 20;
      var MOVE_DUR = 0.5;
      var MOVE_EASE = "power3.out"; // out-family; position and blur share it
      var ORDER = [2, 1, 3, 0, 4]; // bow apex first, then outward
      ORDER.forEach(function (k, n) {
        var start = 4.12 + n * 0.07;
        var gust = el("gust-" + k);
        var blurNode = el("streak-blur-" + k);
        // Proxy whose setter writes the X-only stdDeviation on every render, so the blur
        // follows the playhead on any seek (callbacks suppressed or not).
        var blurV = PEAK_BLUR;
        var proxy = {};
        Object.defineProperty(proxy, "v", {
          get: function () {
            return blurV;
          },
          set: function (n) {
            blurV = n;
            blurNode.setAttribute("stdDeviation", n + " 0");
          },
        });
        proxy.v = PEAK_BLUR; // seed: a seek before the move shows the streaked start
        tl.fromTo(gust, { x: -170, opacity: 0 }, { x: 0, opacity: 1, duration: MOVE_DUR, ease: MOVE_EASE }, start);
        tl.fromTo(proxy, { v: PEAK_BLUR }, { v: 0, duration: MOVE_DUR, ease: MOVE_EASE }, start);
      });

      // "RAFALES" lands at 4.8s, then hold.
      tl.fromTo(el("rafales-in"), { yPercent: 110 }, { yPercent: 0, duration: 0.4, ease: "power3.out" }, 4.8);

      window.__timelines[ID] = tl;
    })();
  </script>
