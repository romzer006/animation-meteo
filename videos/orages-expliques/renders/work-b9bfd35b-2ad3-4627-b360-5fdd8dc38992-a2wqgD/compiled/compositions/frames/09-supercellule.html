        { t: 0.3, text: "le roi", state: "display" }, // "roi" 0.32
        { t: 0.8, text: "supercellule", state: "h1" }, // "supercellule" 0.77

        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
