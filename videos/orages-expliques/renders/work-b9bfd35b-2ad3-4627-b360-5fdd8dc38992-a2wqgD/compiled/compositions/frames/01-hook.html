<template>
  <style>

      font-family: "Barlow";
      src: url("assets/fonts/Barlow-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;

    }
    @font-face {

    @font-face {

    @font-face {

    @font-face {

    /* Root — styled by #root only; no background here (ground is a clip layer). */
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: "Barlow";
      color: #f0ece5;
    }

    /* ---- background: ink-black ground + dim diagonal rain hairlines ---- */
    [id="01-hook-ground"] {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      background: #111111;
      overflow: hidden;
      z-index: 0;
    }
    [id="01-hook-rain"] {
      position: absolute;
      left: 0;
      top: -760px;
      width: 1240px;
      height: 2700px;
    }

    /* ---- supporting: one-shot cream flash ---- */
    [id="01-hook-flash"] {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      background: #f0ece5;
      opacity: 0;
      z-index: 1;
    }

    /* ---- foreground: orange jagged bolt (top edge -> y~700) ---- */
    [id="01-hook-boltwrap"] {
      position: absolute;
      left: 280px;
      top: 0;
      width: 520px;
      height: 720px;
      z-index: 2;
    }
    [id="01-hook-bolt"] {
      display: block;
      width: 520px;
      height: 720px;
      overflow: hidden;
    }
    [id="01-hook-bolt"] path {
      fill: none;
      stroke: #e85d26;
      stroke-linecap: butt;
      stroke-linejoin: miter;
      stroke-miterlimit: 4;
    }
    [id="01-hook-bolt-main"] {
      stroke-width: 16;
    }
    [id="01-hook-bolt-a"],
    [id="01-hook-bolt-b"] {
      stroke-width: 8;
    }

    /* ---- camera stage (slow lean-in) — bounded so its scaled box stays in frame ---- */
    [id="01-hook-stage"] {
      position: absolute;
      left: 40px;
      top: 360px;
      width: 1000px;
      height: 1000px;
      transform-origin: 500px 300px;
      z-index: 3;
    }

    /* kicker — mono eyebrow, knockout plate over the bolt (abs y ~420) */
    [id="01-hook-kickerrow"] {
      position: absolute;
      left: 0;
      top: 36px;
      width: 1000px;
      text-align: center;
    }
    [id="01-hook-kicker"] {
      display: inline-block;
      padding: 8px 18px;
      background: #111111;
      font-family: "IBM Plex Mono";
      font-weight: 500;
      font-size: 30px;
      line-height: 36px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #e85d26;
      white-space: nowrap;
    }

    /* count-up hero — cap-center at abs y ~620 */
    [id="01-hook-countrow"] {
      position: absolute;
      left: 0;
      top: 133px;
      width: 1000px;
      display: flex;
      justify-content: center;
      align-items: baseline;
    }
    [id="01-hook-count"] {
      display: inline-block;
      width: 740px;
      text-align: center;
      font-family: "Barlow";
      font-weight: 900;
      font-size: 260px;
      line-height: 0.88;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      color: #f0ece5;
      transform-origin: 50% 55%;
    }
    [id="01-hook-unit"] {
      display: inline-block;
      margin-left: 14px;
      font-family: "Barlow";
      font-weight: 900;
      font-size: 130px;
      line-height: 0.88;
      letter-spacing: -0.02em;
      white-space: nowrap;
      color: #e85d26;
    }

    /* ×5 accent — cap-center at abs y ~880 */
    [id="01-hook-timesrow"] {
      position: absolute;
      left: 0;
      top: 437px;
      width: 1000px;
      text-align: center;
    }
    [id="01-hook-times"] {
      display: inline-block;
      font-family: "Barlow";
      font-weight: 900;
      font-size: 170px;
      line-height: 0.88;
      letter-spacing: -0.04em;
      white-space: nowrap;
      color: #e85d26;
      transform-origin: 50% 50%;
    }

    /* comparison bars — abs centers y 1100 / 1260, x 64 -> 1016 */
    [class~="01-hook-label"] {
      position: absolute;
      left: 24px;
      font-family: "IBM Plex Mono";
      font-weight: 500;
      font-size: 26px;
      line-height: 26px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #888880;
      white-space: nowrap;
    }
    [id="01-hook-lbl-eclair"] {
      top: 670px;
    }
    [id="01-hook-lbl-soleil"] {
      top: 830px;
    }
    [class~="01-hook-track"] {
      position: absolute;
      left: 24px;
      width: 952px;
      height: 56px;
      box-sizing: border-box;
      border: 1px solid #505048;
    }
    [id="01-hook-track-eclair"] {
      top: 712px;
    }
    [id="01-hook-track-soleil"] {
      top: 872px;
    }
    [class~="01-hook-cell"] {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: #505048;
    }
    [class~="01-hook-fill"] {
      position: absolute;
      left: -1px;
      top: -1px;
      width: calc(100% + 2px);
      height: calc(100% + 2px);
      transform-origin: left center;
    }
    [id="01-hook-fill-eclair"] {
      background: #e85d26;
    }
    [id="01-hook-fill-soleil"] {
      background: #f0ece5;
    }
    [class~="01-hook-seg"] {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      margin-left: -1.5px;
      background: #111111;
    }
    [id="01-hook-sun"] {
      position: absolute;
      left: 238px;
      top: 880px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #f0ece5;
      transform-origin: 50% 50%;
    }
  </style>

  <div
    id="root"
    data-composition-id="01-hook"
    data-start="0"
    data-duration="5.165"
    data-width="1080"
    data-height="1920"
  >
    <!-- background (full-bleed clip): ink-black ground + dim rain hairlines -->
    <div
      id="01-hook-ground"
      class="clip"
      data-start="0"
      data-duration="5.165"
      data-track-index="0"
    >
      <svg
        id="01-hook-rain"
        data-layout-ignore
        viewBox="0 0 1240 2700"
        width="1240"
        height="2700"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <g id="01-hook-rain-g" stroke="#F0ECE5" stroke-width="1" opacity="0.26"></g>
      </svg>
    </div>

    <!-- supporting: one-shot full-frame flash -->
    <div id="01-hook-flash" data-layout-ignore></div>

    <!-- foreground subject (scene 1): the strike -->
    <div id="01-hook-boltwrap" data-layout-ignore>
      <svg
        id="01-hook-bolt"
        viewBox="280 0 520 720"
        width="520"
        height="720"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          id="01-hook-bolt-main"
          d="M 560 -24 L 506 110 L 588 170 L 482 300 L 572 356 L 462 500 L 556 548 L 494 650 L 520 700"
        />
        <path id="01-hook-bolt-a" d="M 588 170 L 680 240 L 654 292 L 748 386" />
        <path id="01-hook-bolt-b" d="M 462 500 L 380 560 L 400 606 L 318 690" />
      </svg>
    </div>

    <!-- camera stage: kicker, count-up hero, ×5, comparison bars -->
    <div id="01-hook-stage">
      <div id="01-hook-kickerrow">
        <span id="01-hook-kicker">Température d’un éclair</span>
      </div>

      <div id="01-hook-countrow">
        <span id="01-hook-count">0</span><span id="01-hook-unit">°c</span>
      </div>

      <div id="01-hook-timesrow">
        <span id="01-hook-times">×5</span>
      </div>

      <div id="01-hook-lbl-eclair" class="01-hook-label">Éclair</div>
      <div id="01-hook-track-eclair" class="01-hook-track">
        <div id="01-hook-fill-eclair" class="01-hook-fill">
          <span class="01-hook-seg" style="left: 20%"></span>
          <span class="01-hook-seg" style="left: 40%"></span>
          <span class="01-hook-seg" style="left: 60%"></span>
          <span class="01-hook-seg" style="left: 80%"></span>
        </div>
      </div>

      <div id="01-hook-lbl-soleil" class="01-hook-label">Soleil</div>
      <div id="01-hook-track-soleil" class="01-hook-track">
        <span class="01-hook-cell" style="left: 20%"></span>
        <span class="01-hook-cell" style="left: 40%"></span>
        <span class="01-hook-cell" style="left: 60%"></span>
        <span class="01-hook-cell" style="left: 80%"></span>
        <div id="01-hook-fill-soleil" class="01-hook-fill"></div>
      </div>
      <div id="01-hook-sun"></div>
    </div>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME_ID = "01-hook";
      var host = document.querySelector('[data-composition-id="' + FRAME_ID + '"]') || document;
      function $(id) {
        return host.querySelector('[id="' + id + '"]') || document.getElementById(id);
      }
      var SVGNS = "http://www.w3.org/2000/svg";

      // ---- rain hairlines: deterministic index-based layout, leaning down-left ----
      var rainG = $("01-hook-rain-g");
      if (rainG && !rainG.childNodes.length) {
        for (var i = 0; i < 84; i++) {
          var x = (i * 157 + 31) % 1240;
          var y = (i * 331 + (i % 7) * 53) % 2700;
          var len = 60 + ((i * 47) % 120);
          var ln = document.createElementNS(SVGNS, "line");
          ln.setAttribute("x1", x);
          ln.setAttribute("y1", y);
          ln.setAttribute("x2", x - len * 0.2);
          ln.setAttribute("y2", y + len);
          ln.setAttribute("stroke-opacity", [1, 0.55, 0.8][i % 3]);
          rainG.appendChild(ln);
        }
      }

      // ---- svg-path-draw setup: measured length (polyline fallback if 0) ----
      function polyLen(d) {
        var n = d.match(/-?\d+(\.\d+)?/g).map(Number);
        var t = 0;
        for (var k = 2; k < n.length; k += 2) {
          t += Math.hypot(n[k] - n[k - 2], n[k + 1] - n[k - 1]);
        }
        return t;
      }
      function prepDraw(p) {
        var L = 0;
        try {
          L = p.getTotalLength();
        } catch (e) {
          L = 0;
        }
        if (!L || !isFinite(L)) L = polyLen(p.getAttribute("d"));
        L = Math.ceil(L * 1.02);
        p.style.strokeDasharray = L + " " + L;
        p.style.strokeDashoffset = L;
        return L;
      }

      var boltWrap = $("01-hook-boltwrap");
      var boltMain = $("01-hook-bolt-main");
      var boltA = $("01-hook-bolt-a");
      var boltB = $("01-hook-bolt-b");
      var Lm = prepDraw(boltMain);
      var La = prepDraw(boltA);
      var Lb = prepDraw(boltB);

      var flash = $("01-hook-flash");
      var rain = $("01-hook-rain");
      var stage = $("01-hook-stage");
      var kicker = $("01-hook-kicker");
      var count = $("01-hook-count");
      var unit = $("01-hook-unit");
      var times = $("01-hook-times");
      var lblE = $("01-hook-lbl-eclair");
      var lblS = $("01-hook-lbl-soleil");
      var trackE = $("01-hook-track-eclair");
      var trackS = $("01-hook-track-soleil");
      var fillE = $("01-hook-fill-eclair");
      var fillS = $("01-hook-fill-soleil");
      var sun = $("01-hook-sun");

      // French thousands grouping, deterministic (no locale lookup): 30000 -> "30 000"
      function fmt(v) {
        return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      }

      var tl = gsap.timeline({ paused: true });
      var END = 4.74;

      // ===== continuous underlay: rain drift (background) + slow camera lean-in (stage) =====
      tl.fromTo(rain, { x: 0, y: 0 }, { x: -124, y: 620, duration: END, ease: "none" }, 0);
      tl.fromTo(stage, { scale: 1 }, { scale: 1.03, duration: END, ease: "power1.inOut" }, 0);

      // ===== Scene 1 (0.0–0.5s): bolt strikes top -> y~700 (svg-path-draw ≤0.2s) + one-shot flash =====
      tl.fromTo(boltMain, { strokeDashoffset: Lm }, { strokeDashoffset: 0, duration: 0.15, ease: "none" }, 0.04);
      tl.fromTo(boltA, { strokeDashoffset: La }, { strokeDashoffset: 0, duration: 0.08, ease: "none" }, 0.08);
      tl.fromTo(boltB, { strokeDashoffset: Lb }, { strokeDashoffset: 0, duration: 0.08, ease: "none" }, 0.12);
      // flash fires as the bolt lands, then decays (one-shot, under the bolt)
      tl.fromTo(flash, { opacity: 0 }, { opacity: 0.9, duration: 0.03, ease: "none" }, 0.17);
      tl.fromTo(
        flash,
        { opacity: 0.9 },
        { opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false },
        0.2,
      );

      // ===== Scene 2 (0.9–2.3s): kicker, value-scaled count 0 -> 30 000, bolt dims to 40% =====
      // kicker arrives on "l'air" — before the count peaks
      tl.fromTo(kicker, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.72);
      // bolt recedes behind the number
      tl.fromTo(
        boltWrap,
        { opacity: 1 },
        { opacity: 0.4, duration: 0.45, ease: "power2.out", immediateRender: false },
        0.9,
      );
      // counting-dynamic-scale: value + scale share start + ease
      var COUNT_AT = 0.92;
      var COUNT_DUR = 1.3;
      var COUNT_EASE = "expo.out";
      tl.fromTo(count, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, COUNT_AT);
      // value: discrete per-frame text keyframes on the same ease curve (seek-safe —
      // property sets apply under event-suppressed seeks, unlike an onUpdate callback)
      var countEase = gsap.parseEase(COUNT_EASE);
      var COUNT_STEPS = Math.round(COUNT_DUR * 60);
      for (var s = 0; s <= COUNT_STEPS; s++) {
        var p = s / COUNT_STEPS;
        tl.set(count, { textContent: fmt(countEase(p) * 30000) }, COUNT_AT + p * COUNT_DUR);
      }
      // visual growth: transform scale shares the count's start + ease
      tl.fromTo(count, { scale: 0.45 }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
      // orange "°c" lands on "degrés"
      tl.fromTo(unit, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.62);

      // ===== Scene 3 (2.5–3.3s): "×5" pops in under the number on "cinq" (spring-pop, no overshoot) =====
      tl.fromTo(
        times,
        { scale: 0, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        2.42,
      );

      // ===== Scene 4 (3.3–4.77s): comparison bars fill from the left (stat-bars-and-fills) =====
      tl.fromTo(
        trackE,
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power3.out" },
        3.0,
      );
      tl.fromTo(
        trackS,
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power3.out" },
        3.08,
      );
      tl.fromTo(lblE, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 3.1);
      tl.fromTo(lblS, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 3.18);
      // both fills: same start + ease so they land as one beat — éclair full, soleil one fifth
      tl.fromTo(fillE, { scaleX: 0 }, { scaleX: 1, duration: 0.95, ease: "power3.out" }, 3.34);
      tl.fromTo(fillS, { scaleX: 0 }, { scaleX: 0.2, duration: 0.95, ease: "power3.out" }, 3.34);
      // the Sun disc settles at the end of the short bar on "Soleil"
      tl.fromTo(sun, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 4.05);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-hook"] = tl;
    })();
  </script>
</template>
