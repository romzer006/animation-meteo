  <script>
    (function () {
      // Every authored class carries the frame_id prefix; a leading digit is not a valid CSS
      // identifier, so targets are resolved with [class~="..."] attribute selectors.
      function S(name) {
        return '[class~="03-ingredients-' + name + '"]';
      }

      var DURATION = 7.24;
      var tl = gsap.timeline({ paused: true });

      // ── Ambient: the faint hairline grid drifts up a few px under the whole shot (background only).
      tl.fromTo(S("grid"), { y: 0 }, { y: -24, duration: DURATION, ease: "none" }, 0);

      // ── Scene 1 (0.0–1.4s) · kicker + per-word h1 — dynamic-content-sequencing.
      // Content-aware cadence: each entry earns BASE + chars × SEC_PER_CHAR + hold; absolute starts
      // are pre-computed ONCE at build (lands "3" on "trois" ≈0.33s, "ingrédients" ≈0.63s).
      var HEAD_START = 0.08;
      var BASE_DURATION = 0.15;
      var SEC_PER_CHAR = 0.01;
      var HEAD = [
        { key: "kicker", text: "LA RECETTE", hold: 0 },
        { key: "three", text: "3", hold: 0.14 },
        { key: "word", text: "ingrédients", hold: 0.2 },
      ];
      var cumulative = HEAD_START;
      var HEAD_TIMELINE = HEAD.map(function (entry) {
        var dur = BASE_DURATION + entry.text.length * SEC_PER_CHAR + entry.hold;
        var start = cumulative;
        cumulative += dur;
        return { key: entry.key, start: start, end: cumulative };
      });
      var headAt = {};
      HEAD_TIMELINE.forEach(function (entry) {
        headAt[entry.key] = entry.start;
      });

      tl.fromTo(
        S("kicker"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        headAt.kicker,
      );
      tl.fromTo(
        S("three"),
        { opacity: 0, y: 90, scale: 0.88, transformOrigin: "0% 100%" },
        { opacity: 1, y: 0, scale: 1, transformOrigin: "0% 100%", duration: 0.8, ease: "expo.out" },
        headAt.three,
      );
      tl.fromTo(
        S("word"),
        { opacity: 0, y: 60 },
        { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" },
        headAt.word,
      );

      // Frame-then-fill: the three empty slots (hairline + mono number) assemble in a cascade
      // while "ingrédients" is spoken — the recipe's frame, waiting to be filled.
      [1, 2, 3].forEach(function (i, k) {
        var t = 0.86 + k * 0.1;
        tl.fromTo(
          S("rule" + i),
          { scaleX: 0, transformOrigin: "0% 50%" },
          { scaleX: 1, transformOrigin: "0% 50%", duration: 0.9, ease: "expo.out" },
          t,
        );
        tl.fromTo(
          S("num" + i),
          { opacity: 0, x: -10 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
          t + 0.05,
        );
      });

      // A slot fills: its number lights fire-orange and its name slides up into place.
      function fillSlot(i, t) {
        tl.fromTo(
          S("num" + i),
          { color: "#505048" },
          { color: "#E85D26", duration: 0.35, ease: "power2.out" },
          t,
        );
        tl.fromTo(
          S("h2-" + i),
          { opacity: 0, y: 60 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          t + 0.02,
        );
      }

      // ── Scene 2 (1.4–2.2s) · card 01 "humidité" — the drop falls into its slot.
      fillSlot(1, 1.4);
      tl.fromTo(
        S("drop"),
        { opacity: 0, y: -80 },
        { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
        1.42,
      );

      // ── Scene 3 (2.2–4.2s) · card 02 "instabilité" — warm rises from below on "chaud" (2.5s),
      // cold sinks from above on "froid" (3.45s).
      fillSlot(2, 2.22);
      tl.fromTo(
        S("arrow-chaud"),
        { opacity: 0, y: 60 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        2.5,
      );
      tl.fromTo(
        S("tag-chaud"),
        { opacity: 0, x: -12 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        2.58,
      );
      tl.fromTo(
        S("arrow-froid"),
        { opacity: 0, y: -60 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        3.43,
      );
      tl.fromTo(
        S("tag-froid"),
        { opacity: 0, x: -12 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
        3.5,
      );

      // ── Scene 4 (4.3–7.24s) · card 03 "déclencheur" on "coup de pouce"; chips land on their words.
      fillSlot(3, 4.3);

      function chipIn(name, t) {
        tl.fromTo(
          S("chip-" + name),
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },

      // "relief" (5.19s) — the mountain triangle rises from its base.
      chipIn("relief", 5.17);
      tl.fromTo(
        S("ico-relief"),
        { scaleY: 0, transformOrigin: "50% 100%" },
        { scaleY: 1, transformOrigin: "50% 100%", duration: 0.5, ease: "expo.out" },

      // "front" (5.8s) — the hairline draws, then its teeth pop up along it.
      chipIn("front", 5.78);

        S("front-line"),
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, transformOrigin: "0% 50%", duration: 0.45, ease: "expo.out" },
        5.84,

      tl.fromTo(

        { scale: 0, transformOrigin: "50% 100%" },
